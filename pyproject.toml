[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byollm"
version = "0.1.0"
description = "Build Your Own LLM Inference Engine From Scratch — pure Python + NumPy, real GGUF models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luv", email = "luv@luvgo.local" }]
license = { text = "MIT" }
keywords = ["llm", "inference", "gguf", "from-scratch", "educational"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
byollm = "byollm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "black", "ruff", "mypy"]

[tool.hatch.version]
path = "byollm/__init__.py"
